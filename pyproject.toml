[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-petri"
version = "0.1.0"
description = "Your forges as cultures on a petri dish, in the terminal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-petri = "gitpetri.cli:main"

[tool.setuptools.packages.find]
include = ["gitpetri*"]
